<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Review Sentiment Analysis</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card-box {
            width: 700px;
            background: white;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.25);
        }

        h1 {
            font-weight: 700;
            color: #2575fc;
        }

        p {
            color: gray;
        }

        textarea {
            border-radius: 12px !important;
            resize: none;
        }

        textarea:focus {
            border-color: #6a11cb !important;
            box-shadow: 0 0 10px rgba(106,17,203,.4) !important;
        }

        .btn-custom {
            background: linear-gradient(90deg,#6a11cb,#2575fc);
            color: white;
            border: none;
            font-weight: 600;
            border-radius: 30px;
            padding: 10px 35px;
            transition: .3s;
        }

        .btn-custom:hover {
            transform: scale(1.05);
            color: white;
        }

        .result {
            margin-top: 25px;
            padding: 15px;
            border-radius: 12px;
            font-size: 22px;
            font-weight: bold;
        }

        .positive {
            background: #d4edda;
            color: #155724;
        }

        .negative {
            background: #f8d7da;
            color: #721c24;
        }

        footer {
            margin-top: 20px;
            color: gray;
            font-size: 14px;
        }
    </style>

</head>

<body>

<div class="card-box">

    <h1 class="text-center">🎬 Movie Review Sentiment Analysis</h1>

    <p class="text-center">
        Enter your movie review below and let AI predict whether it's
        <strong>Positive</strong> or <strong>Negative</strong>.
    </p>

    <form action="/predict" method="POST">

        <div class="mb-3">
            <textarea
                class="form-control"
                name="review"
                rows="8"
                placeholder="Write your movie review here...">{{ review if review else "" }}</textarea>
        </div>

        <div class="text-center">
            <button class="btn btn-custom" type="submit">
                🔍 Predict Sentiment
            </button>
        </div>

    </form>

    {% if prediction %}

        {% if "Positive" in prediction %}

        <div class="result positive text-center">
            😊 {{ prediction }}
        </div>

        {% else %}

        <div class="result negative text-center">
            😞 {{ prediction }}
        </div>

        {% endif %}

    {% endif %}

    <footer class="text-center">
        Built with ❤️ using Flask • Scikit-learn • NLP
    </footer>

</div>

</body>

</html>
